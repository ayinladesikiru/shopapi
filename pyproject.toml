[project]
name = "shopapi"
version = "0.1.0"
description = "A Django REST Framework backend for an online shop, built as a class project for learning Django."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.2",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
]
